<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<!-- Gera og-andre.jpg (1200x630). Conteúdo no quadrado central: o WhatsApp recorta assim. -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
body{margin:0;width:1200px;height:630px;background:#efeeea;color:#141413;display:flex;overflow:hidden}
.faixa{width:285px;display:grid;grid-template-columns:repeat(5,1fr)}

.meio{width:630px;display:flex;flex-direction:column;justify-content:center;padding:0 48px;box-sizing:border-box}
h1{font:500 104px/.88 "Bodoni Moda",serif;letter-spacing:-.02em;margin:0 0 30px}
p{font:500 17px/1.6 "IBM Plex Mono",monospace;letter-spacing:.14em;text-transform:uppercase;margin:0}
.foto{width:285px;background:url(../assets/img/andre-700.webp) 50% 25%/cover;filter:grayscale(1)}

<body><div class="faixa"><i></i><i></i><i></i><i></i><i></i></div>
