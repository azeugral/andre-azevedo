<!-- titulo: Trabalhos · Andre Azevedo Tattoo -->
<!-- desc: Portfólio de Andre Azevedo: tatuagens fineline e realismo preto e branco feitas em Capão Bonito, SP. -->
<!-- lightbox: sim -->
---
<section class="secao topo-pag" aria-labelledby="t-trab">
  <div class="wrap">
    <div class="cab centro">
      <p class="rot">Portfólio</p>
      <h1 id="t-trab">Trabalhos</h1>
      <p class="lead">Fineline e realismo preto e branco, dos mais recentes aos mais antigos. Toque numa foto para ampliar.</p>
    </div>
    <div class="filtros-wrap">
      <div class="filtros" role="group" aria-label="Filtrar por estilo">
        <button type="button" data-f="todos" aria-pressed="true">Todos <sup></sup></button>
        <button type="button" data-f="fineline" aria-pressed="false">Fineline <sup></sup></button>
        <button type="button" data-f="realismo" aria-pressed="false">Realismo <sup></sup></button>
      </div>
    </div>
    <div class="grade" data-grade></div>
  </div>
</section>
<section class="secao vinho chamada" aria-labelledby="t-chamada">
  <div class="wrap centro">
    <p class="rot">Gostou de algum?</p>
    <h2 id="t-chamada">Agenda <span class="ouro">aberta</span></h2>
    <p class="lead">Mande a referência e o local do corpo. O Andre responde com o valor e a data.</p>
    <div class="acoes">
      <a class="btn" href="orcamento.html">Pedir orçamento <!--seta--></a>
      <a class="btn linha" data-dm href="https://www.instagram.com/andreazevedotattoo/" target="_blank" rel="noopener">Chamar na DM</a>
    </div>
  </div>
</section>
